[app]
name = "freshrss"
version = "1.0.0"
description = "FreshRSS self-hosted feed reader with Cloud in a Bottle single sign-on"
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/healthz"
public_paths = ["/healthz"]

[resources]
memory_mb = 512
cpu_cores = 0.25

[data]
app_data = true
